spring:
  application:
    name: flagship-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flagship}
    username: ${SPRING_DATASOURCE_USERNAME:flagship}
    password: ${SPRING_DATASOURCE_PASSWORD:flagship_dev_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

flagship:
  security:
    jwt-secret: ${FLAGSHIP_JWT_SECRET:dev-only-override-via-env-variable-32bytes}
    jwt-expiration-seconds: 86400
